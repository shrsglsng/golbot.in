; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp8266]
platform = espressif8266
board = esp01_1m
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
	waspinator/AccelStepper@^1.64
build_src_filter = +<esp8266.cpp> -<atmega2560.cpp> -<atmega2560_logger.cpp>

[env:atmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = waspinator/AccelStepper@^1.64
build_src_filter = +<atmega2560.cpp> -<esp8266.cpp> -<atmega2560_logger.cpp>

[env:atmega2560_logger]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = +<atmega2560_logger.cpp> -<atmega2560.cpp> -<esp8266.cpp>

[env:nodemcu_esp32]
platform = espressif32
board = nodemcu-32s
framework = arduino
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
build_src_filter = +<nodemcu.cpp> -<esp8266.cpp> -<atmega2560.cpp> -<atmega2560_logger.cpp>
